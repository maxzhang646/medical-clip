model:
  image_encoder: ViT-B/32
  text_encoder: medicalai/ClinicalBERT
  embed_dim: 512
  freeze_image_layers: 8

training:
  batch_size: 64
  epochs: 50
  optimizer: AdamW
  lr_projections: 1.0e-4
  lr_encoders: 1.0e-5
  warmup_ratio: 0.1
  lr_schedule: cosine
  temperature: 0.07
  fp16: false          # MPS does not support fp16; set true for CUDA

data:
  indiana_dir: /Users/wenluzhang/.cache/kagglehub/datasets/raddar/chest-xrays-indiana-university/versions/2
  nih_dir: data/nih
  image_size: 224
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  stratify_by: patient_id

eval:
  recall_at_k: [1, 5, 10]
  nih_classes:
    - Atelectasis
    - Cardiomegaly
    - Consolidation
    - Edema
    - Effusion
    - Infiltration
    - Pneumonia
    - Pneumothorax

paths:
  checkpoint_dir: checkpoints
  log_dir: logs
